  # Android 12+ Configuration
  android_12:
    color: "#e1e5e9"
    color_dark: "#081118"
    image: "Assets/icons/splash_light_1152.png"
    image_dark: "Assets/icons/splash_dark_1152.png"
    branding: "Assets/icons/teamclock_logo_final_branding_light.png"
    branding_dark: "Assets/icons/teamclock_logo_final_branding_dark.png"
